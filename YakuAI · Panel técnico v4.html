<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>YakuAI · Panel técnico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f1;--surface:#fff;--line:#dde5e3;--line-2:#e9eeed;--hover:#f5f8f7;--ink:#0e1e24;--ink-2:#33474e;--muted:#5f7378;--faint:#93a3a7;
--p-800:#08504a;--p-700:#0b6e66;--p-600:#0f8b7f;--p-500:#25a69d;--p-100:#c5e6e0;--p-50:#e6f4f1;--night:#0d2a2f;--night-2:#15414a;--lime:#c8f169;
--crit:#b3261e;--crit-bg:#fdefee;--crit-bd:#f4c9c5;--riega:#1a5fa8;--riega-bg:#ecf4fc;--riega-bd:#c3dbf2;--espera:#8a5700;--espera-bg:#fff6e2;--espera-bd:#f0d9a3;--nodata:#55696e;--nodata-bg:#eff3f3;--nodata-bd:#d9e1e2;--ok:#17774a;--ok-bg:#e9f6ef;--ok-bd:#bfe3cf;
--shadow:0 1px 2px rgba(14,30,36,.05),0 16px 36px -26px rgba(14,30,36,.25);--font:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--display:'Space Grotesk','DM Sans',system-ui,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}h1,h2,h3,p,dl,dd,dt,ol,ul{margin:0}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--p-500);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* cabecera superior + navegación horizontal */
.top{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:auto minmax(0,420px) 1fr;align-items:center;gap:6px 28px;padding:14px 44px 0;background:rgba(238,242,241,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--night);color:var(--lime);display:grid;place-items:center;font-size:19px}
.brand b{display:block;font-family:var(--display);font-size:19px;letter-spacing:-.03em;line-height:1.1}.brand small{font-size:11.5px;color:var(--muted);font-weight:500}
.search{position:relative;display:block}.search .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:99px;background:var(--surface);padding:0 16px 0 42px;outline:none}
.search input:focus,.field input:focus,.field select:focus{border-color:var(--p-500);box-shadow:0 0 0 4px rgba(37,166,157,.16)}
.top-r{display:flex;align-items:center;gap:12px;justify-self:end}.live{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:#2fc57a;box-shadow:0 0 0 3px rgba(47,197,122,.2)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--night);color:var(--lime);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}.avatar.lg{width:56px;height:56px;font-size:17px;font-family:var(--display)}
.nav{grid-column:1/-1;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -8px;padding:6px 8px 0}.nav::-webkit-scrollbar{display:none}
.nav h6{width:1px;height:18px;background:var(--line);margin:0 10px;flex:none}.nav h6:first-child{display:none}
.nav a{position:relative;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent;transition:color .15s}
.nav a .ic{font-size:17px}.nav a:hover{color:var(--ink)}.nav a.on{color:var(--ink);border-bottom-color:var(--p-600)}.nav a.on .ic{color:var(--p-600)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:#e5484d;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.menu-btn{display:none}
.page{padding:34px 44px 80px;max-width:1280px;margin:0 auto}
/* encabezados */
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--p-600)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin:6px 0 26px}
.head h1{font-family:var(--display);font-size:34px;line-height:1.1;letter-spacing:-.04em;font-weight:700}.head p{margin-top:6px;color:var(--muted)}
.head .acts{display:flex;gap:10px;flex-wrap:wrap}
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:32px 0 14px}.sec h2{font-family:var(--display);font-size:20px;letter-spacing:-.03em;display:flex;align-items:center;gap:10px}
/* controles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;transition:all .15s}
.btn:hover{border-color:#c3cfcc;background:var(--hover)}.btn .ic{font-size:16px}.btn.sm{height:34px;padding:0 14px;font-size:13px}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--night);border-color:var(--night);color:#fff}.btn.primary:hover{background:var(--night-2)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--night);font-weight:700}.btn.lime:hover{filter:brightness(.95)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.25);color:#fff}.btn.ghost:hover{background:rgba(255,255,255,.1)}
.icon-btn{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}.icon-btn:hover{background:var(--hover)}.icon-btn .ic{font-size:18px}
.cnt{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;border-radius:99px;background:#e5484d;color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.spin{animation:spin .9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.link{display:inline-flex;align-items:center;gap:5px;border:0;background:none;font-weight:700;font-size:13.5px;color:var(--p-600);min-height:32px}.link:hover{color:var(--p-800)}.link .ic{font-size:15px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:7px}
.field input,.field select{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;outline:none}.field small{display:block;color:var(--muted);font-size:12px;margin-top:6px}.field input[type=range]{padding:0;height:24px;accent-color:var(--p-600)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{height:36px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px}.chip:hover{background:var(--hover)}.chip.on{background:var(--night);border-color:var(--night);color:#fff}.chip em{font-style:normal;font-size:12px;opacity:.7}
.tabs{display:inline-flex;background:#e0e8e6;padding:4px;border-radius:99px;margin-bottom:22px}.tabs button{height:36px;padding:0 22px;border:0;background:none;border-radius:99px;font-weight:600;font-size:13.5px;color:var(--muted)}.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(14,30,36,.14)}
/* tarjetas base */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.card.pad{padding:22px 24px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:14px 24px;border-bottom:1px solid var(--line-2)}.card-h h3{font-size:15.5px;font-weight:700}.card-b{padding:22px 24px}
.row-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.row-h h3{font-size:15px;display:flex;align-items:center;gap:8px}.row-h small{display:block}
.count{background:var(--line-2);color:var(--muted);font:700 12px var(--font);border-radius:99px;padding:2px 10px}
.pill{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid;white-space:nowrap}.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}.pill.nodot::before{display:none}.pill .ic{font-size:12px}
.t-critica{color:var(--crit);background:var(--crit-bg);border-color:var(--crit-bd)}.t-riega{color:var(--riega);background:var(--riega-bg);border-color:var(--riega-bd)}.t-espera{color:var(--espera);background:var(--espera-bg);border-color:var(--espera-bd)}.t-sindatos{color:var(--nodata);background:var(--nodata-bg);border-color:var(--nodata-bd)}.t-ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-bd)}
.k-critica{--c:var(--crit)}.k-riega{--c:var(--riega)}.k-espera{--c:#d99a1c}.k-sindatos{--c:#9aa9ac}.k-ok{--c:#2fb36f}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}.d-critica{--c:var(--crit)}.d-riega{--c:var(--riega)}.d-espera{--c:#d99a1c}.d-sindatos{--c:#9aa9ac}.d-ok{--c:#2fb36f}
.qb{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;border:1px solid;font-size:18px;flex:none}
.bar{height:7px;border-radius:99px;background:var(--line-2);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--p-600)}.bar i.warn{background:#e5484d}.bar i.rec{background:var(--p-100)}
.bar.on-dark{background:rgba(255,255,255,.14)}.bar.on-dark i{background:var(--lime)}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px}.segs i{height:10px;border-radius:99px}.s-ok{background:#38b676}.s-warn{background:#e9b23c}.s-bad{background:#e5484d}.s-none{background:#d5d8d2}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}.legend span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:7px;background:var(--c)}
.note{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:8px}
.fresh{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}.fresh::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c,#38b676)}.f-warn{--c:#e9b23c}.f-bad{--c:#e5484d}.f-none{--c:#b5bdb9}
.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:60px 24px}.empty .bub{width:60px;height:60px;border-radius:50%;background:var(--p-50);color:var(--p-600);display:grid;place-items:center;font-size:24px}.empty h3{font-family:var(--display);font-size:19px}.empty p{color:var(--muted);max-width:360px}
.gauge{position:relative;height:8px;border-radius:99px;background:var(--line-2);margin-top:10px}.gauge i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--p-500),var(--p-600))}.gauge u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px;text-decoration:none}
.big{font-family:var(--display);font-size:42px;font-weight:700;letter-spacing:-.04em;line-height:1}.rd{display:flex;align-items:baseline;gap:12px;margin:6px 0 18px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat3 div{background:var(--bg);border-radius:14px;padding:11px 14px}.stat3 small{display:block;font-size:12px;color:var(--muted)}.stat3 b{font-size:15.5px}
/* RESUMEN: banner oscuro + tarjetas con medidor */
.banner,.night{background:linear-gradient(135deg,var(--night),var(--night-2));color:#fff;border-radius:28px;position:relative;overflow:hidden}
.banner{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:30px;padding:38px 40px;align-items:center}
.banner::after{content:'';position:absolute;right:-90px;top:-110px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(200,241,105,.22),transparent 68%)}
.banner .eyebrow{color:var(--lime)}.banner h1{font-family:var(--display);font-size:40px;line-height:1.08;letter-spacing:-.045em;margin:12px 0 10px;text-wrap:balance}.banner p{color:#a9c9c8}.bn-a{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.hstats{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative;z-index:1}.hs{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:18px 20px}
.hs b{display:block;font-family:var(--display);font-size:38px;letter-spacing:-.04em;line-height:1}.hs span{font-size:12.5px;color:#a9c9c8}.hs.c b{color:#ff9d94}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.pc{position:relative;text-align:left;display:flex;flex-direction:column;gap:2px;padding:20px 20px 18px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);transition:transform .18s,border-color .18s;overflow:hidden}
.pc::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--c,var(--line))}.pc:hover{transform:translateY(-3px);border-color:var(--c)}
.pc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.pc-n{font-family:var(--display);font-size:19px;letter-spacing:-.03em}.pc small{color:var(--muted);font-size:13px}
.pc-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:16px}.pc-h .num{font-family:var(--display);font-size:34px;line-height:1;letter-spacing:-.04em}.pc-h small{text-align:right;font-size:11.5px;line-height:1.3}
.pc>p{margin-top:14px;font-size:13px;color:var(--ink-2)}
.lot{padding:0}.lot-b{padding:16px 20px 18px;display:flex;flex-direction:column;gap:2px}.thumb{display:block;width:100%;height:118px;background:#e9f0ea}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:32px}
/* EVALUAR */
.selrow{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px}
.sel{display:flex;align-items:center;gap:12px;padding:12px 18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;flex:none}.sel b{display:block;font-size:14px;line-height:1.25}.sel small{color:var(--muted);font-size:12.5px}.sel.on{background:var(--night);border-color:var(--night);color:#fff}.sel.on small{color:#a9c9c8}
.pinfo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 20px}.pt{font-family:var(--display);font-size:22px;letter-spacing:-.03em;font-weight:700}.pt small{font:500 13.5px var(--font);color:var(--muted);margin-left:8px;letter-spacing:0}
.statusrow{display:flex;gap:10px;flex-wrap:wrap}.schip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:99px;border:1px solid;font-size:12.5px;font-weight:700}.schip span{font-weight:500;opacity:.85}.schip .ic{font-size:14px}
.evgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.ticket{border:1px solid;border-radius:26px;padding:32px;position:relative;overflow:hidden}.ticket::after{content:'';position:absolute;right:-60px;bottom:-80px;width:240px;height:240px;border-radius:50%;background:currentColor;opacity:.06}
.ticket .k{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}.ticket h2{font-family:var(--display);font-size:46px;line-height:1.02;letter-spacing:-.05em;margin:14px 0 10px}
.ticket .vol{font-family:var(--display);font-size:32px;font-weight:700;letter-spacing:-.03em}.ticket .vol small{font:600 14px var(--font);opacity:.75}.ticket p{margin-top:8px;font-size:15px}
.tk-m{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0 0;padding-top:20px;border-top:1px solid currentColor;border-top-color:color-mix(in srgb,currentColor 22%,transparent)}.tk-m dt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7}.tk-m dd{font-weight:700;font-size:15px;margin-top:2px}
.tk-a{margin-top:22px;position:relative;z-index:1}
.ledger{list-style:none;padding:8px 12px}.ledger li{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:14px}.ledger li+li{border-top:1px dashed var(--line)}
.ln{width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}.ledger b{display:block;font-size:14px}.ledger small{color:var(--muted);font-size:12.5px}.ledger .num{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.02em}
.ledger li.last{background:var(--night);color:#fff;border-top:0;margin-top:6px}.ledger li.last .ln{background:var(--lime);color:var(--night)}.ledger li.last small{color:#a9c9c8}
.why{padding:6px 24px 22px;color:var(--ink-2);font-size:14px}
/* ALERTAS, AGRICULTORES, SENSORES */
.agrid,.fgrid,.sgrid,.cgrid,.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.ac{display:flex;flex-direction:column;gap:2px;padding:20px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:20px;box-shadow:var(--shadow)}
.ac-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.ac b{font-family:var(--display);font-size:18px;letter-spacing:-.03em}.ac small{color:var(--muted)}.ac p{margin-top:10px;color:var(--ink-2);font-size:13.5px}.ac-f{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2)}
.fc{padding:24px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}.fc b{font-family:var(--display);font-size:19px;letter-spacing:-.03em;margin-top:8px}.fc-p{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 6px}.fc-f{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:auto;padding-top:14px;border-top:1px solid var(--line-2)}.pin{letter-spacing:.12em;color:var(--muted);font-weight:600}
.tychips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.tychip{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;background:var(--surface);border:1px solid var(--line);border-radius:99px}.tychip .ic{color:var(--p-600);font-size:18px}.tychip small{color:var(--muted)}
.sc{padding:22px}.sc b{font-family:var(--display);font-size:18px;letter-spacing:-.03em;display:block}.sc .btn{margin-top:16px}
.rd3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}.rd3 span{display:block;font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.04em;line-height:1.1}.rd3 span small{font-size:13px;color:var(--muted);margin-left:2px}.rd3 em{font-style:normal;font-size:12px;color:var(--muted)}.rd3.off{display:block;padding:12px 0;color:var(--muted)}
/* CLIMA / HISTORIAL / CATÁLOGOS / VALIDACIÓN */
.clgrid,.hgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:20px;align-items:stretch}
.night{padding:30px;display:flex;flex-direction:column;justify-content:center;gap:22px}.night p{color:#a9c9c8;margin-top:12px}.night .k{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
.ringw{position:relative;width:132px;height:132px}.ringw b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:24px;letter-spacing:-.03em}
.bigl{font-family:var(--display);font-size:80px;letter-spacing:-.06em;line-height:1;margin-top:8px}.bigl small{font-size:30px;margin-left:4px;color:var(--lime)}
.cl-ch{padding:14px 24px 0;margin:0}.cl-ch .chip{height:32px;font-size:12.5px}

<script>
/* ============ utilidades ============ */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const ic=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('es-PE');
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const MIN=60000,DAY=864e5;
const ageMin=ts=>(Date.now()-ts)/MIN;
function ageLabel(ts){const m=Math.round(ageMin(ts));if(m<1)return'ahora';if(m<60)return`hace ${m} min`;const h=Math.floor(m/60),r=m%60;return`hace ${h} h${r?` ${r} min`:''}`}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const todayLong=()=>cap(new Date().toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'}));
const ftime=ts=>new Date(ts).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',hour12:false});
const fday=ts=>new Date(ts).toLocaleDateString('es-PE',{day:'2-digit',month:'short'});
const ini=n=>n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
const hourKey=ts=>{const d=new Date(ts);return`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}-${d.getHours()}`};

/* ============ catálogos ============ */
const st=(n,from,to,kc,zr,p)=>({n,from,to,kc,zr,p});
const CROPS=[
 {id:'papa',name:'Papa',stages:[st('Inicial',0,25,.50,.30,.35),st('Desarrollo',26,55,.80,.45,.35),st('Media',56,95,1.15,.60,.35),st('Final',96,130,.75,.60,.35)]},
 {id:'maiz',name:'Maíz choclo',stages:[st('Inicial',0,20,.30,.30,.50),st('Desarrollo',21,50,.72,.60,.50),st('Media',51,90,1.15,1.00,.50),st('Final',91,120,1.05,1.00,.50)]},
 {id:'haba',name:'Haba seca',stages:[st('Inicial',0,25,.50,.30,.45),st('Desarrollo',26,50,.80,.50,.45),st('Media',51,95,1.15,.80,.45),st('Final',96,125,.30,.80,.45)]},
 {id:'zanahoria',name:'Zanahoria',stages:[st('Inicial',0,25,.70,.25,.35),st('Desarrollo',26,45,.85,.40,.35),st('Media',46,90,1.05,.50,.35),st('Final',91,120,.95,.50,.35)]}
];
const SOILS=[
 {id:'arenoso',name:'Arenoso',cc:.12,pmp:.05},
 {id:'franco-arenoso',name:'Franco-arenoso',cc:.20,pmp:.09},
 {id:'franco',name:'Franco',cc:.30,pmp:.14},
 {id:'franco-arcilloso',name:'Franco-arcilloso',cc:.36,pmp:.20},
 {id:'arcilloso',name:'Arcilloso',cc:.42,pmp:.26}
];
const RA=16.1; // Ra FAO (mm/día) · Chupaca, octubre
const stageOf=(crop,age)=>crop.stages.find(s=>age>=s.from&&age<=s.to)||crop.stages[crop.stages.length-1];

/* ============ geometría de parcelas ============ */
const SC=0.0625; // m² por px²
const polyArea=pts=>{let a=0;for(let i=0;i<pts.length;i++){const[x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length];a+=x1*y2-x2*y1}return Math.abs(a)/2*SC};
function polyFor(area,seed){const px=area/SC,r=1.25+((seed*7)%5)/20,w=Math.sqrt(px*r),h=px/w,cx=200,cy=130,j=(seed%3+1)*6;
 return[[cx-w/2,cy-h/2+j],[cx+w/2,cy-h/2-j],[cx+w/2-j,cy+h/2],[cx-w/2+j,cy+h/2+j]].map(p=>p.map(Math.round))}
function mapBase(){
 let g='';for(let x=40;x<400;x+=40)g+=`<line x1="${x}" y1="0" x2="${x}" y2="260" stroke="#c7d6cc" stroke-width="1"/>`;
 for(let y=40;y<260;y+=40)g+=`<line x1="0" y1="${y}" x2="400" y2="${y}" stroke="#c7d6cc" stroke-width="1"/>`;
 return`<rect width="400" height="260" fill="#e9f0ea"/>
 <path d="M0 215 C90 175 210 245 400 185 L400 260 L0 260Z" fill="#dfe9e1"/>
 <path d="M0 60 C120 20 240 95 400 40" fill="none" stroke="#cfdcd2" stroke-width="2"/>
 <path d="M0 90 C120 50 240 125 400 70" fill="none" stroke="#d6e1d8" stroke-width="1.5"/>${g}
 <g transform="translate(14,238)"><line x1="0" y1="0" x2="40" y2="0" stroke="#4f6a66" stroke-width="2"/><text x="0" y="-5" font-size="10" fill="#4f6a66" font-family="inherit">10 m</text></g>`;
}
function plotMap(pts,color='#12857f'){
 const p=pts.map(q=>q.join(',')).join(' ');
 return`<svg class="map" viewBox="0 0 400 260" role="img" aria-label="Área de la parcela">${mapBase()}<polygon points="${p}" fill="${color}" fill-opacity=".28" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}

/* ============ estado y datos demo ============ */
const mkSensor=(h,age,rain,temp)=>{const cal={dry:1010,wet:320};return{cal,raw:Math.round(cal.dry-h/100*(cal.dry-cal.wet)),rain,temp,ts:Date.now()-age*MIN}};
const hourly=(p,seed)=>Array.from({length:12},(_,i)=>clamp(Math.round(p+Math.sin((i+seed)*.9)*16+(i-5)*(p>=70?-2.5:1.5)),2,98));
const mkPlot=(o)=>({...o,sowDate:Date.now()-o.sow*DAY,fc:{p:o.p,mm:o.mm,hourly:hourly(o.p,o.id)},t:{mean:(o.tx+o.tn)/2,max:o.tx,min:o.tn},sensor:o.sAge==null?null:mkSensor(o.h,o.sAge,o.wet||false,o.temp)});
const S={
 seq:0,sel:1,query:'',cropF:'all',alertF:'all',cSel:1,catTab:'cultivos',
 weather:{ts:Date.now()-70*MIN,demo:false},
 farmers:[
  {id:1,name:'Rosa Quispe',phone:'+51 964 218 330',pin:'4827'},
  {id:2,name:'Julián Huamán',phone:'+51 951 774 102',pin:'1593'},
  {id:3,name:'Marta Ccora',phone:'+51 987 306 541',pin:'7064'},
  {id:4,name:'Pedro Yupanqui',phone:'+51 944 120 875',pin:'3318'},

function calc(plot){
 const crop=CROPS.find(c=>c.id===plot.crop),soil=SOILS.find(s=>s.id===plot.soil);
 const age=Math.max(0,Math.floor((Date.now()-plot.sowDate)/DAY)),s=stageOf(crop,age),{mean,max,min}=plot.t;
 const et0=0.0023*(mean+17.8)*Math.sqrt(Math.max(max-min,0))*RA;
 return{crop,soil,age,st:s,et0,etc:et0*s.kc,taw:1000*(soil.cc-soil.pmp)*s.zr};
}
function evaluate(plot,ts=Date.now()){
 const c=calc(plot),s=plot.sensor;
 const ev={id:++S.seq,plotId:plot.id,ts,age:c.age,stage:c.st.n,crop:c.crop.name};
 if(!s)return{...ev,status:'incompleta',cause:'Sin lecturas de sensor registradas',msg:'Sin lecturas de sensor'};
 const sAge=ageMin(s.ts),wAge=ageMin(S.weather.ts);
 if(sAge>=30){const cause=`Última lectura ${ageLabel(s.ts)} · máx. 30 min`;return{...ev,status:'incompleta',cause,msg:cause}}
 if(wAge>=180){const cause=`Pronóstico ${ageLabel(S.weather.ts)} · máx. 3 h`;return{...ev,status:'incompleta',cause,msg:cause}}
 const hum=humOf(plot),hp=Math.round(hum*100),thr=Math.round((1-c.st.p)*100);
 const raw=c.st.p*c.taw,def=(1-hum)*c.taw;
 const crit=hum<=.20,rainOn=plot.fc.p>=70,eff=rainOn?plot.fc.mm*.8:0;
 let decision,net=def;
 if(crit)decision='riega';
 else if(def<raw)decision='no_riega';
 else{net=Math.max(def-eff,0);decision=(rainOn&&net<raw)?'espera':'riega'}
 const mm=Math.round(net),lo=decision==='riega'?Math.floor(net*plot.area/50)*50:0;
 let why,msg,next;
 if(crit){why=`Humedad ${hp} % (≤ 20 %): suelo crítico. Se riega sin esperar lluvia.`;msg=`Humedad ${hp} % · suelo crítico`;next='En 3 h, tras el riego'}
 else if(decision==='riega'){why=`Humedad ${hp} % bajo el umbral de ${thr} %. Déficit ${Math.round(def)} mm${eff?`, menos ${eff.toFixed(1)} mm de lluvia efectiva`:''}.`;msg=`Humedad ${hp} % bajo umbral ${thr} %`;next='Mañana 05:30'}
 else if(decision==='espera'){why=`La lluvia prevista (${plot.fc.p} %, ${eff.toFixed(1)} mm efectivos) deja el déficit bajo el umbral. Esperar 6 h.`;msg=`Lluvia ${plot.fc.p} % cubre el déficit`;next='En 6 h'}
 else{why=`Humedad ${hp} % sobre el umbral de ${thr} %. Déficit ${Math.round(def)} mm de ${Math.round(raw)} mm permitidos.`;msg=`Humedad ${hp} % sobre umbral ${thr} %`;next=`En ${clamp(Math.round((raw-def)/c.etc*24),6,24)} h`}
 const rainTxt=!rainOn?`${plot.fc.p} % · sin descuento`:crit?`${plot.fc.p} % · ignorada`:decision==='espera'?`${plot.fc.p} % · cubre déficit`:`−${eff.toFixed(1)} mm`;
 const steps=[
  {k:'Edad',v:`${c.age} d`,s:c.crop.name},{k:'Kc',v:c.st.kc.toFixed(2),s:c.st.n},
  {k:'ET₀',v:`${c.et0.toFixed(1)} mm/d`,s:'Hargreaves'},{k:'ETc',v:`${c.etc.toFixed(1)} mm/d`,s:'Kc × ET₀'},
  {k:'Umbral',v:`${thr} %`,s:`RAW ${Math.round(raw)} mm`},{k:'Lluvia',v:rainTxt,s:'≥ 70 % descuenta'},
  {k:'Decisión',v:{riega:'Regar',no_riega:'No regar',espera:'Esperar'}[decision],s:decision==='riega'?`${mm} mm`:decision==='espera'?'6 h':'—'}];
 return{...ev,status:'ok',decision,crit,hp,thr,mm,lo,hi:lo+50,def,raw,why,msg,next,steps,conf:(sAge<=15&&wAge<=90)?'Alta':'Media'};
}

function pairBars(days){
 const W=520,H=190,base=150,max=Math.max(...days.flatMap(d=>[d.a,d.b]),1000),bw=15;
 const slot=(W-20)/days.length;let s='';
 [0,.5,1].forEach(f=>{const y=base-f*120;s+=`<line x1="10" x2="${W-10}" y1="${y}" y2="${y}" stroke="#e8eeec"/>`});
 days.forEach((d,i)=>{const x=10+i*slot+slot/2,ha=d.a/max*120,hb=d.b/max*120;
  s+=`<rect x="${x-bw-1}" y="${base-ha}" width="${bw}" height="${Math.max(ha,1)}" rx="5" fill="#bfe3de"/>
      <rect x="${x+1}" y="${base-hb}" width="${bw}" height="${Math.max(hb,1)}" rx="5" fill="#12857f"/>
      <text x="${x}" y="${base+22}" text-anchor="middle" font-size="12" fill="#62767c" font-family="inherit">${d.l}</text>`});
 return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Litros recomendados contra aplicados por día">${s}</svg>`;
}
function rainBars(arr){
 const W=600,H=200,base=156,n=arr.length,bw=34,gap=(W-40-n*bw)/(n-1);let s='';
 const h0=new Date().getHours()+1;
 s+=`<line x1="20" x2="${W-20}" y1="${base-70*1.2}" y2="${base-70*1.2}" stroke="#1b5fa6" stroke-dasharray="4 4" opacity=".55"/><text x="${W-20}" y="${base-70*1.2-6}" text-anchor="end" font-size="11" fill="#1b5fa6" font-family="inherit">Umbral 70 %</text>`;
 arr.forEach((v,i)=>{const x=20+i*(bw+gap),h=v*1.2,on=v>=70;
  s+=`<rect x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="8" fill="${on?'#1b5fa6':'#cfe6e2'}"/>
      <text x="${x+bw/2}" y="${base-h-7}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${on?'#1b5fa6':'#62767c'}" font-family="inherit">${v}</text>
      <text x="${x+bw/2}" y="${base+20}" text-anchor="middle" font-size="11.5" fill="#62767c" font-family="inherit">${(h0+i)%24}h</text>`});
 return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Probabilidad de lluvia por hora">${s}</svg>`;
}

function histRows(){
 const rows=S.irr.map(r=>({...r}));
 Object.values(S.evals).forEach(ev=>{if(ev.decision==='riega'&&!S.irr.some(r=>r.plotId===ev.plotId&&new Date(r.ts).toDateString()===new Date().toDateString()))rows.push({ts:ev.ts,plotId:ev.plotId,rec:ev.lo,app:null,pending:true})});
 return rows.sort((a,b)=>b.ts-a.ts);
}
function histDays(){
 const rows=histRows(),out=[];
 for(let i=6;i>=0;i--){
  const d=new Date(Date.now()-i*DAY),k=d.toDateString(),rs=rows.filter(r=>new Date(r.ts).toDateString()===k);
  out.push({l:d.toLocaleDateString('es-PE',{weekday:'short'}).replace('.','').slice(0,3),a:rs.reduce((s,r)=>s+(r.rec||0),0),b:rs.reduce((s,r)=>s+(r.app||0),0)});
 }
 return out;
}

function viewHistorial(){

 return head('Registro','Historial de riego','Lo recomendado frente a lo que el agricultor aplicó',`<button class="btn primary" data-act="new-irr">${ic('plus')} Registrar riego aplicado</button>`)+

 <section class="card"><div class="card-h"><h3>Últimos 7 días</h3><div class="legend" style="margin:0"><span style="--c:#bfe3de">Recomendado</span><span style="--c:#12857f">Aplicado</span></div></div><div class="card-b">${pairBars(days)}</div></section></div>
 <div class="sec"><h2>Registro de riegos <span class="count num">${rows.length}</span></h2></div>
 <div class="card"><ul class="hl">${rows.map(r=>{const p=plotById(r.plotId);let t,l,d='—';
  if(!r.rec){t='sindatos';l='Sin recomendación'}else if(r.app==null){t='espera';l=r.pending?'Pendiente':'Sin registro'}
  else{const x=(r.app-r.rec)/r.rec;d=(x>0?'+':'')+Math.round(x*100)+' %';if(Math.abs(x)<=.1){t='ok';l='Cumplido'}else if(x<0){t='espera';l='Menos riego'}else{t='riega';l='Más riego'}}
  const m=Math.max(r.rec||0,r.app||0,1);
  return`<li><div class="hd"><b class="num">${fday(r.ts)}</b></div><div class="hn"><b>${esc(p?.name||'—')}</b><small>${r.rec?fmt(r.rec)+' L rec.':'—'} · ${r.app!=null?fmt(r.app)+' L aplic.':'sin registro'}</small></div>

}

function toast(msg){$('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}

function openModal({title,sub,body,confirm='Guardar',onMount,onSubmit,wide,drawer}){
 closeModal();const el=document.createElement('div');el.id='overlay';el.className='overlay'+(drawer?' dr':'');

  ${onSubmit?`<footer class="m-foot"><button type="button" class="btn" data-act="close">Cancelar</button><button type="button" class="btn primary" id="m-ok">${confirm}</button></footer>`:''}</div>`;
 document.body.appendChild(el);
 const form=$('form',el);form.addEventListener('submit',e=>e.preventDefault());
 if(onSubmit)$('#m-ok',el).addEventListener('click',()=>{if(onSubmit(form)!==false)closeModal()});

   const upd=()=>{const p=plotById(+form.plot.value),cal=p.sensor?.cal||{dry:1010,wet:320},h=clamp((cal.dry-form.raw.value)/(cal.dry-cal.wet),0,1);
    $('#payload').textContent=`POST /measurements\n{ "plot_id": ${p.id}, "yl69_raw": ${form.raw.value||0},\n  "fc37_rain": ${form.rain.value==='1'}, "dht11_temp": ${form.temp.value||0} }`;
    $('#hnote').innerHTML=`${ic('droplets')} Humedad calibrada: <b class="num">${Math.round(h*100)} %</b>`};
   form.addEventListener('input',upd);upd();},
  onSubmit(f){const p=plotById(+f.plot.value),cal=p.sensor?.cal||{dry:1010,wet:320};
   p.sensor={cal,raw:clamp(+f.raw.value,0,1023),rain:f.rain.value==='1',temp:+f.temp.value,ts:Date.now()};toast('Lectura registrada · datos frescos');renderView();renderNav()}});
}
function modalCalibrate(id){
 const p=plotById(id),cal={...p.sensor.cal};
 openModal({title:`Calibrar YL-69 · ${esc(p.name)}`,sub:'Calibración de 2 puntos: sensor seco y sensor en agua',
  body:`<div class="row2"><div class="field"><label>ADC en seco (0 %)</label><input name="dry" type="number" value="${cal.dry}"></div><div class="field"><label>ADC saturado (100 %)</label><input name="wet" type="number" value="${cal.wet}"></div></div>
   <div class="field"><label>Prueba: lectura ADC</label><input name="test" type="range" min="0" max="1023" value="${p.sensor.raw}"><small id="tv"></small></div>`,
  onMount(form){const upd=()=>{const d=+form.dry.value,w=+form.wet.value;$('#tv').innerHTML=`ADC ${form.test.value} → <b>${Math.round(clamp((d-form.test.value)/(d-w||1),0,1)*100)} %</b> de humedad`};form.addEventListener('input',upd);upd()},
  onSubmit(f){const d=+f.dry.value,w=+f.wet.value;if(d<=w){toast('El valor seco debe ser mayor que el saturado');return false}p.sensor.cal={dry:d,wet:w};toast('Calibración guardada');renderView()}});
}
function modalIrr(id){
 const p0=plotById(id)||S.plots[0],ev=S.evals[p0.id];
 openModal({title:'Registrar riego aplicado',sub:'Lo que el agricultor realmente aplicó',
  body:`<div class="field"><label>Parcela</label><select name="plot">${plotOpts(p0.id)}</select></div>
   <div class="field"><label>Litros aplicados</label><input name="app" type="number" min="0" step="50" value="${ev?.decision==='riega'?ev.lo:''}" placeholder="Ej. 16000"><small>Recomendado hoy: ${ev?.decision==='riega'?fmt(ev.lo)+' L':'sin recomendación de riego'}</small></div>`,
  onSubmit(f){const a=+f.app.value;if(!(a>0)){toast('Ingresa los litros aplicados');return false}
   const pid=+f.plot.value,e=S.evals[pid];S.irr.push({ts:Date.now(),plotId:pid,rec:e?.decision==='riega'?e.lo:null,app:a});toast('Riego registrado');renderView()}});
}
function drawerPlot(id){
 const p=plotById(id),c=calc(p),ev=S.evals[id],f=farmerOf(p);
 openModal({title:esc(p.name),sub:`${esc(f?.name||'Sin agricultor')} · ${c.crop.name}`,drawer:true,
  body:`${plotMap(polyFor(p.area,p.id))}
   ${ev?`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">${pill(toneOf(ev))}<span class="muted" style="font-size:13px">${esc(ev.msg)}</span></div>`:''}
   <dl class="kv"><dt>Área</dt><dd class="num">${fmt(p.area)} m²</dd><dt>Siembra</dt><dd>${new Date(p.sowDate).toLocaleDateString('es-PE')} · día ${c.age}</dd>
    <dt>Etapa</dt><dd>${c.st.n}</dd><dt>Kc · Zr · p</dt><dd class="num">${c.st.kc.toFixed(2)} · ${c.st.zr.toFixed(2)} m · ${c.st.p.toFixed(2)}</dd>
    <dt>Suelo</dt><dd>${c.soil.name}</dd><dt>CC · PMP</dt><dd class="num">${c.soil.cc.toFixed(2)} · ${c.soil.pmp.toFixed(2)}</dd>
    <dt>Humedad actual</dt><dd class="num">${p.sensor?Math.round(humOf(p)*100)+' %':'—'}</dd><dt>Última lectura</dt><dd>${freshText(p)}</dd></dl>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn primary" data-act="open-eval" data-id="${id}">${ic('droplets')} Evaluar</button><button type="button" class="btn" data-act="reading" data-id="${id}">${ic('radio')} Registrar lectura</button></div>`});
}

/* ============ acciones ============ */
const A={
 close:closeModal,
 menu:()=>$('#side').classList.toggle('open'),
 go:t=>nav(t.dataset.to),
 refresh:t=>{const i=$('.ic',t);i.classList.add('spin');setTimeout(()=>{renderView();toast('Resumen actualizado')},500)},
 'open-eval':t=>{closeModal();S.sel=+t.dataset.id;nav('evaluar')},
 'sel-plot':t=>{S.sel=+t.dataset.id;renderView()},
 'run-eval':()=>{const p=plotById(S.sel);runEvaluation(p);renderView();renderNav()},
 'alert-f':t=>{S.alertF=t.dataset.f;renderView()},
 'send-wa':t=>{S.sent[+t.dataset.id]=ftime(Date.now());toast('Aviso enviado por WhatsApp');renderView()},
 'crop-f':t=>{S.cropF=t.dataset.f;renderView()},
 'open-plot':t=>drawerPlot(+t.dataset.id),
 'new-plot':modalNewPlot,'new-farmer':modalNewFarmer,
 'reset-pin':t=>{const f=S.farmers.find(x=>x.id===+t.dataset.id);f.pin=String(1000+Math.floor(Math.random()*9000));toast(`PIN nuevo para ${f.name}: ${f.pin}`)},
 reading:t=>{closeModal();modalReading(+t.dataset.id)},
 calibrate:t=>modalCalibrate(+t.dataset.id),
 'new-irr':t=>modalIrr(+t.dataset.id),
 'demo-ingest':()=>{S.plots.forEach(p=>{if(p.sensor){p.sensor.ts=Date.now();p.sensor.raw=clamp(p.sensor.raw+Math.round((Math.random()-.5)*30),0,1023)}});toast('Ingesta demo: lecturas frescas');renderView();renderNav()},
 'weather-refresh':()=>{S.weather.ts=Date.now();toast('Pronóstico actualizado · vigente 3 h');renderView()},
 'weather-demo':()=>{S.weather.demo=!S.weather.demo;S.weather.ts=Date.now();toast(S.weather.demo?'Modo demo (fallback) activado':'Fuente OpenWeatherMap');renderView()},
 'clima-sel':t=>{S.cSel=+t.dataset.id;renderView()},
 tab:t=>{S.catTab=t.dataset.t;renderView()},
 'run-val':()=>{S.val={n:0,running:true};renderView();const it=setInterval(()=>{S.val.n++;if(S.val.n>=10){S.val.running=false;clearInterval(it)}if(route()==='validacion')renderView()},380)},
 print:()=>window.print()
};
document.addEventListener('click',e=>{
 if(e.target.id==='overlay'){closeModal();return}
 const t=e.target.closest('[data-act]');
 if(t&&A[t.dataset.act]){if(t.tagName==='A')e.preventDefault();A[t.dataset.act](t,e)}
});
$('#q').addEventListener('input',e=>{S.query=e.target.value;if(!['parcelas','agricultores'].includes(route()))nav('parcelas');else renderView()});

/* ============ arranque ============ */
seed();renderNav();renderView();
setInterval(()=>{if(!$('#overlay')){renderView()}},60000);
</script>
</body>
</html>
