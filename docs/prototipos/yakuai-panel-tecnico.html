<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YakuAI · Panel técnico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7f6;--surface:#fff;--line:#e3e9e7;--line-2:#eef2f0;
  --ink:#12262c;--ink-2:#3b4f55;--muted:#62767c;--faint:#93a3a7;
  --p-900:#0a2a2e;--p-700:#0f6b66;--p-600:#12857f;--p-400:#3cc6b9;--p-100:#d5efeb;--p-50:#ecf7f5;
  --crit:#b3261e;--crit-bg:#fdeceb;--crit-bd:#f2c3bf;
  --riega:#1b5fa6;--riega-bg:#eaf3fc;--riega-bd:#bcd7f2;
  --espera:#8a5700;--espera-bg:#fff5df;--espera-bd:#efd69b;
  --nodata:#5b6e74;--nodata-bg:#eef2f2;--nodata-bd:#d6dedf;
  --ok:#1a7a45;--ok-bg:#e8f6ed;--ok-bd:#b9e2c8;
  --shadow:0 1px 2px rgba(18,38,44,.05),0 6px 20px rgba(18,38,44,.04);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* layout */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#0a2a2e,#0c3438);color:#b7d0cd;display:flex;flex-direction:column;padding:22px 14px 16px;z-index:60}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px 18px}
.brand-mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#37c2b6,#12857f);display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 6px 16px rgba(18,133,127,.4)}
.brand b{display:block;color:#fff;font-size:18px;letter-spacing:-.01em;line-height:1.1;font-weight:800}
.brand small{font-size:11.5px;color:#7fa5a2;font-weight:500}
.nav{flex:1;overflow:auto;margin:0 -4px;padding:0 4px}
.nav h6{margin:18px 10px 6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#6d9490;font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:#b7d0cd;font-weight:600;font-size:14px;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(255,255,255,.11);color:#fff;box-shadow:inset 3px 0 0 var(--p-400)}
.nav .ic{font-size:18px}
.nav .badge{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:#e5534b;color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.side-foot{margin-top:10px;padding:12px;border-radius:14px;background:rgba(255,255,255,.06);display:flex;align-items:center;gap:11px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--p-100);color:var(--p-700);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.side-foot b{display:block;color:#fff;font-size:13.5px;line-height:1.2}
.side-foot small{font-size:11.5px;color:#7fa5a2}
.dot{width:8px;height:8px;border-radius:50%;background:#3ddc97;display:inline-block;margin-right:6px}

.main{min-width:0}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:14px 32px;background:rgba(244,247,246,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.menu-btn{display:none}
.search{position:relative;flex:1;max-width:380px}
.search .ic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{width:100%;height:44px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:0 16px 0 42px;outline:none}
.search input:focus,.field input:focus,.field select:focus{border-color:var(--p-600);box-shadow:0 0 0 3px rgba(18,133,127,.15)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.chip-date{font-size:13px;font-weight:600;color:var(--muted);padding:0 4px;white-space:nowrap}
.page{padding:28px 32px 64px;max-width:1180px;margin:0 auto}

/* head */
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--p-700)}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--p-600)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin:10px 0 24px}
.head h1{font-size:30px;line-height:1.15;letter-spacing:-.025em;font-weight:800;text-wrap:balance;max-width:760px}
.head p{margin-top:8px;color:var(--muted);font-size:15px}
.head .acts{display:flex;gap:10px;align-items:center}
.hl-c{color:var(--crit)}.hl-r{color:var(--riega)}.hl-n{color:var(--nodata)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#c9d6d3;background:#fafcfb}
.btn.primary{background:var(--p-700);border-color:var(--p-700);color:#fff;box-shadow:0 4px 14px rgba(15,107,102,.28)}
.btn.primary:hover{background:#0c5a56}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-2);transition:.15s}
.icon-btn:hover{border-color:var(--p-100);color:var(--p-700)}
.icon-btn .ic{font-size:18px}
.icon-btn .cnt{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;border-radius:99px;background:#e5534b;color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line-2)}
.card-h h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-b{padding:20px 22px}
.count{background:var(--line-2);color:var(--muted);font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px}
.link{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:13.5px;color:var(--p-700);min-height:36px}
.link:hover{text-decoration:underline}
.grid-2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:18px;align-items:start}
.stack{display:grid;gap:18px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid;white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.t-critica{color:var(--crit);background:var(--crit-bg);border-color:var(--crit-bd)}
.t-riega{color:var(--riega);background:var(--riega-bg);border-color:var(--riega-bd)}
.t-espera{color:var(--espera);background:var(--espera-bg);border-color:var(--espera-bd)}
.t-sindatos{color:var(--nodata);background:var(--nodata-bg);border-color:var(--nodata-bd)}
.t-ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-bd)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{display:flex;align-items:center;gap:14px;padding:18px 20px}
.kpi .bub{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:21px;border:1px solid}
.kpi b{display:block;font-size:26px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.kpi span{font-size:13px;color:var(--muted);font-weight:500}

/* queue */
.q{list-style:none;margin:0;padding:0}
.qrow{display:flex;align-items:center;gap:16px;width:100%;padding:16px 22px;border:0;background:none;text-align:left;border-bottom:1px solid var(--line-2);transition:.15s}
.qrow:last-child{border-bottom:0}
.qrow:hover{background:#fafcfb}
.qrow:focus-visible{outline:2px solid rgba(18,133,127,.4);outline-offset:-2px}
.qb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid;font-size:19px;flex:none}
.qrow .tx{min-width:0;flex:1}
.qrow .tx b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .tx small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .tx p{font-size:13.5px;color:var(--ink-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .go{color:var(--faint);transition:.15s}
.qrow:hover .go{transform:translateX(3px);color:var(--ink-2)}

/* empty */
.empty{display:grid;justify-items:center;text-align:center;gap:8px;padding:48px 24px}
.empty .bub{width:56px;height:56px;border-radius:50%;background:var(--p-50);color:var(--p-700);display:grid;place-items:center;font-size:24px}
.empty h3{font-size:17px;font-weight:700}.empty p{color:var(--muted);max-width:360px}

/* mini widgets */
.big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat3 div{background:var(--bg);border-radius:14px;padding:11px 12px}
.stat3 small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.stat3 b{font-size:16px;font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--p-600)}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.segs i{height:10px;border-radius:99px}
.s-ok{background:#38b676}.s-warn{background:#e9b23c}.s-bad{background:#d9544d}.s-none{background:#cdd7d8}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:'';display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:var(--c)}

/* tables */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);text-align:left;padding:12px 22px;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:14px 22px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#fafcfb}
.tbl .r{text-align:right}
.cell-main b{display:block;font-weight:700}.cell-main small{color:var(--muted);font-size:13px}
.who{display:flex;align-items:center;gap:12px}
.fresh{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.fresh::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c,#38b676)}
.f-warn{--c:#e9b23c}.f-bad{--c:#d9544d}.f-none{--c:#b5c1c3}

/* filters */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;transition:.15s}
.chip:hover{border-color:#c9d6d3}
.chip.on{background:var(--p-700);border-color:var(--p-700);color:#fff}
.chip em{font-style:normal;font-size:12px;opacity:.75}

/* evaluar */
.eval{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}
.pick{list-style:none;margin:0;padding:8px}
.pick button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border:0;border-radius:14px;background:none;transition:.15s}
.pick button:hover{background:var(--bg)}
.pick button.on{background:var(--p-50);box-shadow:inset 0 0 0 1px var(--p-100)}
.pick b{display:block;font-size:14.5px;line-height:1.25}.pick small{color:var(--muted);font-size:12.5px}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.d-critica{--c:var(--crit)}.d-riega{--c:var(--riega)}.d-espera{--c:#e0a21a}.d-sindatos{--c:#9aa9ac}.d-ok{--c:#38b676}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.check .bub{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;flex:none}
.check b{display:block;font-size:14px}.check small{color:var(--muted);font-size:12.5px}
.hero{border-radius:20px;border:1px solid;padding:24px 26px;display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center;justify-content:space-between}
.hero .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.hero h2{font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.1;margin-top:6px}
.hero p{margin-top:8px;font-size:15px;opacity:.9}
.hero .lit{font-size:13px;opacity:.8}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.tile{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:#fff}
.tile small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.tile b{font-size:18px;font-weight:700}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.step{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fbfdfc;position:relative}
.step small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.step b{display:block;font-size:16px;font-weight:700;margin:2px 0}
.step span{font-size:12px;color:var(--muted)}
.step.last{background:var(--p-50);border-color:var(--p-100)}
.note{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}

/* sensores */
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.type{display:flex;gap:14px;align-items:flex-start;padding:18px}
.type .bub{width:42px;height:42px;border-radius:13px;background:var(--p-50);color:var(--p-700);display:grid;place-items:center;font-size:19px;flex:none}
.type b{display:block}.type small{color:var(--muted);font-size:13px}
.code{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12.5px;background:#0f2428;color:#cfe8e4;border-radius:12px;padding:13px 15px;white-space:pre-wrap;line-height:1.55}

/* forms / modal */
.overlay{position:fixed;inset:0;background:rgba(9,30,34,.5);display:grid;place-items:center;z-index:100;animation:fade .15s}
.overlay.dr{place-items:stretch end}
@keyframes fade{from{opacity:0}}
.modal,.drawer{background:#fff;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(9,30,34,.3);animation:pop .18s}
.modal{width:min(560px,calc(100vw - 28px));max-height:calc(100vh - 40px);border-radius:24px}
.modal.wide{width:min(680px,calc(100vw - 28px))}
.drawer{width:min(480px,100vw);height:100vh;animation:slide .22s}
@keyframes pop{from{transform:translateY(10px);opacity:.6}}
@keyframes slide{from{transform:translateX(30px);opacity:.6}}
.m-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 24px 14px}
.m-head h2{font-size:19px;font-weight:800;letter-spacing:-.015em}.m-head p{color:var(--muted);font-size:13.5px;margin-top:2px}
.m-body{padding:6px 24px 20px;overflow:auto;display:grid;gap:16px}
.m-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line-2)}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.field input,.field select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;outline:none}
.field small{display:block;color:var(--muted);font-size:12px;margin-top:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.map{display:block;width:100%;border-radius:16px;border:1px solid var(--line);background:#eaf1ec;touch-action:manipulation}
.map.draw{cursor:crosshair}
.map-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;text-align:right}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0f2428;color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .2s;max-width:calc(100vw - 32px)}

/* catalog tabs */
.tabs{display:inline-flex;background:var(--line-2);padding:4px;border-radius:999px;margin-bottom:16px;gap:2px}
.tabs button{height:36px;padding:0 18px;border:0;background:none;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(18,38,44,.12)}
.ver{font-size:12px;font-weight:700;color:var(--p-700);background:var(--p-50);border:1px solid var(--p-100);border-radius:99px;padding:2px 10px}

/* validation */
.ring{position:relative;width:92px;height:92px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:800}
.vsum{display:flex;align-items:center;gap:22px;padding:22px;flex-wrap:wrap}

@media (max-width:1024px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid-2,.eval{grid-template-columns:1fr}
  .types{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:274px;transform:translateX(-102%);transition:transform .25s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(9,30,34,.45)}
  .menu-btn{display:grid}
  .top{padding:12px 16px}.page{padding:20px 16px 56px}
  .chip-date{display:none}
  .head h1{font-size:25px}
  .checks,.tiles,.row2{grid-template-columns:1fr}
  .hero h2{font-size:28px}
  .qrow{padding:14px 16px}.card-h{padding:14px 16px}
}
@media print{
  .side,.top,.no-print{display:none!important}
  .app{display:block}body{background:#fff}.card{box-shadow:none}.page{padding:0}
}
</style>
</head>

<script>
/* ============ utilidades ============ */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const ic=(n,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('es-PE');
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const MIN=60000,DAY=864e5;
const ageMin=ts=>(Date.now()-ts)/MIN;
function ageLabel(ts){const m=Math.round(ageMin(ts));if(m<1)return'ahora';if(m<60)return`hace ${m} min`;const h=Math.floor(m/60),r=m%60;return`hace ${h} h${r?` ${r} min`:''}`}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const todayLong=()=>cap(new Date().toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'}));
const ftime=ts=>new Date(ts).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',hour12:false});
const fday=ts=>new Date(ts).toLocaleDateString('es-PE',{day:'2-digit',month:'short'});
const ini=n=>n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
const hourKey=ts=>{const d=new Date(ts);return`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}-${d.getHours()}`};

/* ============ catálogos ============ */
const st=(n,from,to,kc,zr,p)=>({n,from,to,kc,zr,p});
const CROPS=[
 {id:'papa',name:'Papa',stages:[st('Inicial',0,25,.50,.30,.35),st('Desarrollo',26,55,.80,.45,.35),st('Media',56,95,1.15,.60,.35),st('Final',96,130,.75,.60,.35)]},
 {id:'maiz',name:'Maíz choclo',stages:[st('Inicial',0,20,.30,.30,.50),st('Desarrollo',21,50,.72,.60,.50),st('Media',51,90,1.15,1.00,.50),st('Final',91,120,1.05,1.00,.50)]},
 {id:'haba',name:'Haba seca',stages:[st('Inicial',0,25,.50,.30,.45),st('Desarrollo',26,50,.80,.50,.45),st('Media',51,95,1.15,.80,.45),st('Final',96,125,.30,.80,.45)]},
 {id:'zanahoria',name:'Zanahoria',stages:[st('Inicial',0,25,.70,.25,.35),st('Desarrollo',26,45,.85,.40,.35),st('Media',46,90,1.05,.50,.35),st('Final',91,120,.95,.50,.35)]}
];
const SOILS=[
 {id:'arenoso',name:'Arenoso',cc:.12,pmp:.05},
 {id:'franco-arenoso',name:'Franco-arenoso',cc:.20,pmp:.09},
 {id:'franco',name:'Franco',cc:.30,pmp:.14},
 {id:'franco-arcilloso',name:'Franco-arcilloso',cc:.36,pmp:.20},
 {id:'arcilloso',name:'Arcilloso',cc:.42,pmp:.26}
];
const RA=16.1; // Ra FAO (mm/día) · Chupaca, octubre
const stageOf=(crop,age)=>crop.stages.find(s=>age>=s.from&&age<=s.to)||crop.stages[crop.stages.length-1];

/* ============ geometría de parcelas ============ */
const SC=0.0625; // m² por px²
const polyArea=pts=>{let a=0;for(let i=0;i<pts.length;i++){const[x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length];a+=x1*y2-x2*y1}return Math.abs(a)/2*SC};
function polyFor(area,seed){const px=area/SC,r=1.25+((seed*7)%5)/20,w=Math.sqrt(px*r),h=px/w,cx=200,cy=130,j=(seed%3+1)*6;
 return[[cx-w/2,cy-h/2+j],[cx+w/2,cy-h/2-j],[cx+w/2-j,cy+h/2],[cx-w/2+j,cy+h/2+j]].map(p=>p.map(Math.round))}
function mapBase(){
 let g='';for(let x=40;x<400;x+=40)g+=`<line x1="${x}" y1="0" x2="${x}" y2="260" stroke="#c7d6cc" stroke-width="1"/>`;
 for(let y=40;y<260;y+=40)g+=`<line x1="0" y1="${y}" x2="400" y2="${y}" stroke="#c7d6cc" stroke-width="1"/>`;
 return`<rect width="400" height="260" fill="#e9f0ea"/>
 <path d="M0 215 C90 175 210 245 400 185 L400 260 L0 260Z" fill="#dfe9e1"/>
 <path d="M0 60 C120 20 240 95 400 40" fill="none" stroke="#cfdcd2" stroke-width="2"/>
 <path d="M0 90 C120 50 240 125 400 70" fill="none" stroke="#d6e1d8" stroke-width="1.5"/>${g}
 <g transform="translate(14,238)"><line x1="0" y1="0" x2="40" y2="0" stroke="#4f6a66" stroke-width="2"/><text x="0" y="-5" font-size="10" fill="#4f6a66" font-family="inherit">10 m</text></g>`;
}
function plotMap(pts,color='#12857f'){
 const p=pts.map(q=>q.join(',')).join(' ');
 return`<svg class="map" viewBox="0 0 400 260" role="img" aria-label="Área de la parcela">${mapBase()}<polygon points="${p}" fill="${color}" fill-opacity=".28" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}

/* ============ estado y datos demo ============ */
const mkSensor=(h,age,rain,temp)=>{const cal={dry:1010,wet:320};return{cal,raw:Math.round(cal.dry-h/100*(cal.dry-cal.wet)),rain,temp,ts:Date.now()-age*MIN}};
const hourly=(p,seed)=>Array.from({length:12},(_,i)=>clamp(Math.round(p+Math.sin((i+seed)*.9)*16+(i-5)*(p>=70?-2.5:1.5)),2,98));
const mkPlot=(o)=>({...o,sowDate:Date.now()-o.sow*DAY,fc:{p:o.p,mm:o.mm,hourly:hourly(o.p,o.id)},t:{mean:(o.tx+o.tn)/2,max:o.tx,min:o.tn},sensor:o.sAge==null?null:mkSensor(o.h,o.sAge,o.wet||false,o.temp)});
const S={
 seq:0,sel:1,query:'',cropF:'all',alertF:'all',cSel:1,catTab:'cultivos',
 weather:{ts:Date.now()-70*MIN,demo:false},
 farmers:[
  {id:1,name:'Rosa Quispe',phone:'+51 964 218 330',pin:'4827'},
  {id:2,name:'Julián Huamán',phone:'+51 951 774 102',pin:'1593'},
  {id:3,name:'Marta Ccora',phone:'+51 987 306 541',pin:'7064'},
  {id:4,name:'Pedro Yupanqui',phone:'+51 944 120 875',pin:'3318'},
  {id:5,name:'Elena Poma',phone:'+51 962 551 207',pin:'9241'}],
 plots:[
  mkPlot({id:1,name:'Los Pinos',farmer:1,crop:'papa',soil:'franco',area:400,sow:58,h:58,p:20,mm:1,tx:21,tn:5,temp:12.4,sAge:8}),
  mkPlot({id:2,name:'Wayra Pata',farmer:2,crop:'maiz',soil:'franco-arenoso',area:500,sow:40,h:15,p:85,mm:14,tx:22,tn:6,temp:13.1,sAge:12}),
  mkPlot({id:3,name:'Chacra Alta',farmer:3,crop:'haba',soil:'franco-arcilloso',area:600,sow:70,h:78,p:10,mm:0,tx:20,tn:4,temp:11.8,sAge:22}),
  mkPlot({id:4,name:'El Mirador',farmer:4,crop:'haba',soil:'franco',area:350,sow:15,h:70,p:30,mm:2,tx:21,tn:5,temp:12.0,sAge:200}),
  mkPlot({id:5,name:'San Isidro',farmer:1,crop:'zanahoria',soil:'franco-arenoso',area:300,sow:12,h:60,p:85,mm:16,tx:21,tn:6,temp:13.6,sAge:5,wet:true}),
  mkPlot({id:6,name:'Qocha',farmer:5,crop:'maiz',soil:'franco',area:450,sow:15,h:85,p:40,mm:3,tx:20,tn:5,temp:12.6,sAge:14})],
 evals:{},log:[],sent:{},irr:[],val:{n:10,running:false}
};
const plotById=id=>S.plots.find(p=>p.id===id);
const farmerOf=p=>S.farmers.find(f=>f.id===p.farmer);
const humOf=p=>{const s=p.sensor;return clamp((s.cal.dry-s.raw)/(s.cal.dry-s.cal.wet),0,1)};

/* ============ motor hídrico ============ */
function calc(plot){
 const crop=CROPS.find(c=>c.id===plot.crop),soil=SOILS.find(s=>s.id===plot.soil);
 const age=Math.max(0,Math.floor((Date.now()-plot.sowDate)/DAY)),s=stageOf(crop,age),{mean,max,min}=plot.t;
 const et0=0.0023*(mean+17.8)*Math.sqrt(Math.max(max-min,0))*RA;
 return{crop,soil,age,st:s,et0,etc:et0*s.kc,taw:1000*(soil.cc-soil.pmp)*s.zr};
}
function evaluate(plot,ts=Date.now()){
 const c=calc(plot),s=plot.sensor;
 const ev={id:++S.seq,plotId:plot.id,ts,age:c.age,stage:c.st.n,crop:c.crop.name};
 if(!s)return{...ev,status:'incompleta',cause:'Sin lecturas de sensor registradas',msg:'Sin lecturas de sensor'};
 const sAge=ageMin(s.ts),wAge=ageMin(S.weather.ts);
 if(sAge>=30){const cause=`Última lectura ${ageLabel(s.ts)} · máx. 30 min`;return{...ev,status:'incompleta',cause,msg:cause}}
 if(wAge>=180){const cause=`Pronóstico ${ageLabel(S.weather.ts)} · máx. 3 h`;return{...ev,status:'incompleta',cause,msg:cause}}
 const hum=humOf(plot),hp=Math.round(hum*100),thr=Math.round((1-c.st.p)*100);
 const raw=c.st.p*c.taw,def=(1-hum)*c.taw;
 const crit=hum<=.20,rainOn=plot.fc.p>=70,eff=rainOn?plot.fc.mm*.8:0;
 let decision,net=def;
 if(crit)decision='riega';
 else if(def<raw)decision='no_riega';
 else{net=Math.max(def-eff,0);decision=(rainOn&&net<raw)?'espera':'riega'}
 const mm=Math.round(net),lo=decision==='riega'?Math.floor(net*plot.area/50)*50:0;
 let why,msg,next;
 if(crit){why=`Humedad ${hp} % (≤ 20 %): suelo crítico. Se riega sin esperar lluvia.`;msg=`Humedad ${hp} % · suelo crítico`;next='En 3 h, tras el riego'}
 else if(decision==='riega'){why=`Humedad ${hp} % bajo el umbral de ${thr} %. Déficit ${Math.round(def)} mm${eff?`, menos ${eff.toFixed(1)} mm de lluvia efectiva`:''}.`;msg=`Humedad ${hp} % bajo umbral ${thr} %`;next='Mañana 05:30'}
 else if(decision==='espera'){why=`La lluvia prevista (${plot.fc.p} %, ${eff.toFixed(1)} mm efectivos) deja el déficit bajo el umbral. Esperar 6 h.`;msg=`Lluvia ${plot.fc.p} % cubre el déficit`;next='En 6 h'}
 else{why=`Humedad ${hp} % sobre el umbral de ${thr} %. Déficit ${Math.round(def)} mm de ${Math.round(raw)} mm permitidos.`;msg=`Humedad ${hp} % sobre umbral ${thr} %`;next=`En ${clamp(Math.round((raw-def)/c.etc*24),6,24)} h`}
 const rainTxt=!rainOn?`${plot.fc.p} % · sin descuento`:crit?`${plot.fc.p} % · ignorada`:decision==='espera'?`${plot.fc.p} % · cubre déficit`:`−${eff.toFixed(1)} mm`;
 const steps=[
  {k:'Edad',v:`${c.age} d`,s:c.crop.name},{k:'Kc',v:c.st.kc.toFixed(2),s:c.st.n},
  {k:'ET₀',v:`${c.et0.toFixed(1)} mm/d`,s:'Hargreaves'},{k:'ETc',v:`${c.etc.toFixed(1)} mm/d`,s:'Kc × ET₀'},
  {k:'Umbral',v:`${thr} %`,s:`RAW ${Math.round(raw)} mm`},{k:'Lluvia',v:rainTxt,s:'≥ 70 % descuenta'},
  {k:'Decisión',v:{riega:'Regar',no_riega:'No regar',espera:'Esperar'}[decision],s:decision==='riega'?`${mm} mm`:decision==='espera'?'6 h':'—'}];
 return{...ev,status:'ok',decision,crit,hp,thr,mm,lo,hi:lo+50,def,raw,why,msg,next,steps,conf:(sAge<=15&&wAge<=90)?'Alta':'Media'};
}
function toneOf(ev){if(!ev)return'sindatos';if(ev.status==='incompleta')return'sindatos';if(ev.crit)return'critica';return{riega:'riega',espera:'espera',no_riega:'ok'}[ev.decision]}
const labelOf=t=>({critica:'Crítica',riega:'Regar',espera:'Esperar',sindatos:'Sin datos',ok:'No regar'}[t]);
const pill=t=>`<span class="pill t-${t}">${labelOf(t)}</span>`;
const bubStyle=t=>({critica:'color:var(--crit);background:var(--crit-bg);border-color:var(--crit-bd)',riega:'color:var(--riega);background:var(--riega-bg);border-color:var(--riega-bd)',espera:'color:var(--espera);background:var(--espera-bg);border-color:var(--espera-bd)',sindatos:'color:var(--nodata);background:var(--nodata-bg);border-color:var(--nodata-bd)',ok:'color:var(--ok);background:var(--ok-bg);border-color:var(--ok-bd)'}[t]);
const rank={critica:0,riega:1,sindatos:2,espera:3,ok:4};
function runEvaluation(plot){
 const key=plot.id+'|'+hourKey(Date.now()),prev=S.evals[plot.id];
 if(prev&&prev.status==='ok'&&prev.key===key){toast('Ya existe una evaluación de esta hora: se muestra la misma');return prev}
 const ev=evaluate(plot);ev.key=key;S.evals[plot.id]=ev;S.log.push(ev);return ev;
}
function seed(){
 const t0=new Date();t0.setHours(5,30,0,0);
 S.plots.forEach(p=>{const ev=evaluate(p,t0.getTime());ev.key=p.id+'|'+hourKey(t0.getTime());S.evals[p.id]=ev;S.log.push(ev)});
 [[1,1,15900,16000],[1,2,26100,24000],[2,6,9800,9800],[3,1,14500,14000],[3,3,22400,26000],[4,2,24900,25000],[5,4,6100,null],[5,1,15200,15000],[6,6,8200,7500],[6,3,21000,21000]]
  .forEach(([d,p,r,a])=>S.irr.push({ts:Date.now()-d*DAY,plotId:p,rec:r,app:a}));
 Object.values(S.evals).forEach(ev=>{const t=toneOf(ev);if(t==='critica'||t==='riega')S.sent[ev.plotId]='05:31'});
}
function alertsList(){
 return S.plots.map(p=>({p,ev:S.evals[p.id]})).filter(x=>x.ev&&toneOf(x.ev)!=='ok')
  .map(x=>({id:x.p.id,plot:x.p,ev:x.ev,tone:toneOf(x.ev)})).sort((a,b)=>rank[a.tone]-rank[b.tone]);
}
function freshClass(p){if(!p.sensor)return'f-none';const m=ageMin(p.sensor.ts);return m<15?'':m<30?'f-warn':'f-bad'}
function freshText(p){return p.sensor?ageLabel(p.sensor.ts):'Sin lecturas'}

/* ============ gráficos ============ */
function pairBars(days){
 const W=520,H=190,base=150,max=Math.max(...days.flatMap(d=>[d.a,d.b]),1000),bw=15;
 const slot=(W-20)/days.length;let s='';
 [0,.5,1].forEach(f=>{const y=base-f*120;s+=`<line x1="10" x2="${W-10}" y1="${y}" y2="${y}" stroke="#e8eeec"/>`});
 days.forEach((d,i)=>{const x=10+i*slot+slot/2,ha=d.a/max*120,hb=d.b/max*120;
  s+=`<rect x="${x-bw-1}" y="${base-ha}" width="${bw}" height="${Math.max(ha,1)}" rx="5" fill="#bfe3de"/>
      <rect x="${x+1}" y="${base-hb}" width="${bw}" height="${Math.max(hb,1)}" rx="5" fill="#12857f"/>
      <text x="${x}" y="${base+22}" text-anchor="middle" font-size="12" fill="#62767c" font-family="inherit">${d.l}</text>`});
 return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Litros recomendados contra aplicados por día">${s}</svg>`;
}
function rainBars(arr){
 const W=600,H=200,base=156,n=arr.length,bw=34,gap=(W-40-n*bw)/(n-1);let s='';
 const h0=new Date().getHours()+1;
 s+=`<line x1="20" x2="${W-20}" y1="${base-70*1.2}" y2="${base-70*1.2}" stroke="#1b5fa6" stroke-dasharray="4 4" opacity=".55"/><text x="${W-20}" y="${base-70*1.2-6}" text-anchor="end" font-size="11" fill="#1b5fa6" font-family="inherit">Umbral 70 %</text>`;
 arr.forEach((v,i)=>{const x=20+i*(bw+gap),h=v*1.2,on=v>=70;
  s+=`<rect x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="8" fill="${on?'#1b5fa6':'#cfe6e2'}"/>
      <text x="${x+bw/2}" y="${base-h-7}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${on?'#1b5fa6':'#62767c'}" font-family="inherit">${v}</text>
      <text x="${x+bw/2}" y="${base+20}" text-anchor="middle" font-size="11.5" fill="#62767c" font-family="inherit">${(h0+i)%24}h</text>`});
 return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Probabilidad de lluvia por hora">${s}</svg>`;
}

function histRows(){
 const rows=S.irr.map(r=>({...r}));
 Object.values(S.evals).forEach(ev=>{if(ev.decision==='riega'&&!S.irr.some(r=>r.plotId===ev.plotId&&new Date(r.ts).toDateString()===new Date().toDateString()))rows.push({ts:ev.ts,plotId:ev.plotId,rec:ev.lo,app:null,pending:true})});
 return rows.sort((a,b)=>b.ts-a.ts);
}
function histDays(){
 const rows=histRows(),out=[];
 for(let i=6;i>=0;i--){
  const d=new Date(Date.now()-i*DAY),k=d.toDateString(),rs=rows.filter(r=>new Date(r.ts).toDateString()===k);
  out.push({l:d.toLocaleDateString('es-PE',{weekday:'short'}).replace('.','').slice(0,3),a:rs.reduce((s,r)=>s+(r.rec||0),0),b:rs.reduce((s,r)=>s+(r.app||0),0)});
 }
 return out;
}
function viewHistorial(){
 const rows=histRows(),days=histDays();
 const done=rows.filter(r=>r.app!=null&&r.rec);const ok=done.filter(r=>Math.abs(r.app-r.rec)/r.rec<=.1).length;
 return head('Registro','Historial de riego','Lo recomendado frente a lo que el agricultor aplicó',`<button class="btn primary" data-act="new-irr">${ic('plus')} Registrar riego aplicado</button>`)+
 `<div class="grid-2"><section class="card"><div class="card-h"><h3>Últimos 7 días</h3><div class="legend" style="margin:0"><span style="--c:#bfe3de">Recomendado</span><span style="--c:#12857f">Aplicado</span></div></div><div class="card-b">${pairBars(days)}</div></section>
  <section class="card"><div class="card-h"><h3>Cumplimiento</h3></div><div class="card-b"><div class="big num">${done.length?Math.round(ok/done.length*100):0} %</div><p class="muted" style="margin:6px 0 14px">de los riegos dentro de ±10 % de lo recomendado</p><div class="bar"><i style="width:${done.length?ok/done.length*100:0}%"></i></div></div></section></div>
 <section class="card" style="margin-top:18px"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Parcela</th><th class="r">Recomendado</th><th class="r">Aplicado</th><th class="r">Diferencia</th><th>Estado</th></tr></thead><tbody>
 ${rows.map(r=>{const p=plotById(r.plotId);let t,l,d='—';
  if(!r.rec){t='sindatos';l='Sin recomendación'}else if(r.app==null){t='espera';l=r.pending?'Pendiente':'Sin registro'}
  else{const x=(r.app-r.rec)/r.rec;d=(x>0?'+':'')+Math.round(x*100)+' %';if(Math.abs(x)<=.1){t='ok';l='Cumplido'}else if(x<0){t='espera';l='Menos riego'}else{t='riega';l='Más riego'}}
  return`<tr><td class="num">${fday(r.ts)}</td><td><b>${esc(p?.name||'—')}</b></td><td class="r num">${r.rec?fmt(r.rec)+' L':'—'}</td><td class="r num">${r.app!=null?fmt(r.app)+' L':'—'}</td><td class="r num">${d}</td><td><span class="pill t-${t}">${l}</span></td></tr>`}).join('')}</tbody></table></div></section>`;
}

 reading:t=>{closeModal();modalReading(+t.dataset.id)},
 calibrate:t=>modalCalibrate(+t.dataset.id),
 'new-irr':t=>modalIrr(+t.dataset.id),
 'demo-ingest':()=>{S.plots.forEach(p=>{if(p.sensor){p.sensor.ts=Date.now();p.sensor.raw=clamp(p.sensor.raw+Math.round((Math.random()-.5)*30),0,1023)}});toast('Ingesta demo: lecturas frescas');renderView();renderNav()},
 'weather-refresh':()=>{S.weather.ts=Date.now();toast('Pronóstico actualizado · vigente 3 h');renderView()},
 'weather-demo':()=>{S.weather.demo=!S.weather.demo;S.weather.ts=Date.now();toast(S.weather.demo?'Modo demo (fallback) activado':'Fuente OpenWeatherMap');renderView()},
 'clima-sel':t=>{S.cSel=+t.dataset.id;renderView()},
 tab:t=>{S.catTab=t.dataset.t;renderView()},
 'run-val':()=>{S.val={n:0,running:true};renderView();const it=setInterval(()=>{S.val.n++;if(S.val.n>=10){S.val.running=false;clearInterval(it)}if(route()==='validacion')renderView()},380)},
 print:()=>window.print()
};
document.addEventListener('click',e=>{
 if(e.target.id==='overlay'){closeModal();return}
 const t=e.target.closest('[data-act]');
 if(t&&A[t.dataset.act]){if(t.tagName==='A')e.preventDefault();A[t.dataset.act](t,e)}
});
$('#q').addEventListener('input',e=>{S.query=e.target.value;if(!['parcelas','agricultores'].includes(route()))nav('parcelas');else renderView()});

/* ============ arranque ============ */
$('#today').textContent=todayLong();
seed();renderNav();renderView();
setInterval(()=>{if(!$('#overlay')){renderView()}},60000);
</script>
</body>
</html>
